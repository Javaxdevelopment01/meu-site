<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Resumos FC Barcelona</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body { font: 16px Arial; background: #121212; color: #fff; margin:0; padding:0; }
    header { background: #1e1e1e; padding:20px; text-align:center; color:#ffcc00; font-size:24px; }
    section { padding:20px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; }
    .card { background: #1e1e1e; padding: 10px; border-radius: 10px; box-shadow: 0 0 15px rgba(0,0,0,0.5); transition: transform 0.3s ease; }
    .card:hover { transform: scale(1.05); }
    .card img { width: 100%; border-radius: 8px; }
    .card-title { font-weight: bold; margin: 10px 0; color: #ffcc00; }
    .btn-assistir { display:block; padding:10px 0; background:#ffcc00; text-align:center; border-radius:5px; color:#000; text-decoration:none; font-weight:bold; }
    .filtros { margin-bottom: 20px; display: flex; flex-wrap: wrap; gap: 15px; align-items: center; justify-content: center; }
    select, input[type="text"] { padding: 10px; font-size: 16px; border-radius: 5px; border: none; }
    footer { background:#1e1e1e; text-align:center; padding:10px; color:#aaa; margin-top:40px; }
    .back-btn { display:inline-block; margin-top:20px; padding:10px 20px; background:#ffcc00; color:#000; text-decoration:none; border-radius:4px; }
  </style>
</head>
<body>

  <header>FC Barcelona – Resumos & Jogos</header>

  <section class="filtros">
    <select id="categoria" onchange="filtrarVideos()">
      <option value="Todos">Todos</option>
      <option value="El Clasico">El Clásico</option>
      <option value="Champions">Champions League</option>
      <option value="La Liga">La Liga</option>
    </select>
    <input type="text" id="pesquisa" placeholder="Procurar jogo..." onkeyup="pesquisarVideos()" />
  </section>

  <section id="videos" class="grid"></section>

  <a href="index.html" class="back-btn">← Voltar ao Portal</a>

  <footer>© 2025 FC Barcelona Fan Portal | Criado por JAVAX 💙❤️</footer>

  <script src="video.js"></script>

</body>
</html>
